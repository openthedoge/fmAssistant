<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文章模板</title>
<style>
  /* 本模板是独立页面，样式随便改。这段只是给深色主题准备的默认外观。 */
  body{
    margin:0;
    padding:12px;
    background:#181820;
    color:#e9e9ef;
    font:13px/1.75 -apple-system, "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  }
  h2{font-size:15px;margin:0 0 8px}
  h3{font-size:13px;margin:14px 0 6px}
  p{margin:0 0 10px}
  ul,ol{margin:0 0 10px;padding-left:20px}
  img{display:block;max-width:100%;height:auto;margin:10px 0;border-radius:10px}
  .tag{display:inline-block;padding:1px 6px;margin-left:6px;font-size:10px;color:#c8102e;border:1px solid #c8102e;border-radius:6px;vertical-align:middle}
  .muted{color:#8b8b9a;font-size:11px}
</style>
</head>
<body>

<!-- ↓↓↓ 下面这段正文随便改 ↓↓↓ -->

</html>
